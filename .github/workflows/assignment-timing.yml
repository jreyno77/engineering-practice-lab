name: Assignment timing

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to report or recover
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: Validate assignment and report timing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This workflow must never check out or execute the PR head, install its
      # packages, or interpolate PR body/title/branch values into shell commands.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build report from GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPORTER_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node scripts/assignment-timing.mjs
      - name: Preserve the report, including invalid or unfinished evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-timing-pr-${{ inputs.pr_number || github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/assignment-timing/
          if-no-files-found: error
          retention-days: 90
